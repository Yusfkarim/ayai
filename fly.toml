app = "syuhjsbot-yf"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "120s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "15s"

[mounts]
  source = "syuh_data"
  destination = "/data"

[vm]
  size = "shared-cpu-1x"
  memory = "1024mb"
