app = "syuhjsbot-yf"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[vm]
  # ⚠️ chromium (arena.ai) پێویستی بە dedicated CPU + ڕامی زۆر — shared-cpu هەڵدەوەستێت
  size = "performance-2x"
  memory = "4096mb"
